name: Separate Rakuten article creator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_rakuten_articles.py"
      - "tests/test_rakuten_articles.py"
      - "state/rakuten_article_generator.json"
  schedule:
    - cron: "15 8 * * *"
    # Backup run; the generator skips markets already completed for the day.
    - cron: "15 9 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-rakuten-writes
  queue: max
  cancel-in-progress: false

jobs:
  create-rakuten-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test separate Rakuten safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_rakuten.py tests/test_rakuten_articles.py

      - name: Create separate UK and USA Rakuten articles
        env:
          PYTHONPATH: .
          RAKUTEN_UK_CLIENT_ID: ${{ secrets.RAKUTEN_UK_CLIENT_ID }}
          RAKUTEN_UK_CLIENT_SECRET: ${{ secrets.RAKUTEN_UK_CLIENT_SECRET }}
          RAKUTEN_UK_ACCOUNT_ID: ${{ secrets.RAKUTEN_UK_ACCOUNT_ID }}
          RAKUTEN_US_CLIENT_ID: ${{ secrets.RAKUTEN_US_CLIENT_ID }}
          RAKUTEN_US_CLIENT_SECRET: ${{ secrets.RAKUTEN_US_CLIENT_SECRET }}
          RAKUTEN_US_ACCOUNT_ID: ${{ secrets.RAKUTEN_US_ACCOUNT_ID }}
        run: python generate_rakuten_articles.py

      - name: Save separate Rakuten articles
        id: save
        shell: bash
        run: |
          git add articles articles-us state/rakuten_article_generator.json
          if git diff --cached --quiet; then
            echo "No qualifying Rakuten article was created."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "worth-buying-rakuten-bot"
          git config user.email "worth-buying-rakuten-bot@users.noreply.github.com"
          git commit -m "Add separate Rakuten retailer roundups"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start existing UK and USA publishing chain
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
