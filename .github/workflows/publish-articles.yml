name: Publish Blogger articles

# Publishes new and changed UK article files directly through the verified Blogger API.
# Posts are staged as drafts before going live, then feed X, Bluesky and Pinterest.
on:
  workflow_dispatch:
    inputs:
      chain_usa:
        description: "Start the USA publisher after UK completes"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - "publish_articles.py"
      - "publish_site_pages.py"
      - "src/site_pages.py"
      - "src/internal_links.py"
      - "src/publishing_seo.py"
      - "src/article_copy.py"
      - "src/price_charts.py"
      - "generate_price_charts.py"
      - "src/blogger.py"
      - "generate_ai_visuals.py"
      - "src/ai_visuals.py"
      - "src/article_images.py"
      - "scripts/verify_article_images.py"
      - "publish_x.py"
      - "publish_bluesky.py"
      - "generate_pinterest_images.py"
      - "generate_pinterest_feed.py"
      - "generate_x_images.py"
      - "requirements.txt"
      - "src/buffer.py"
      - "src/bluesky.py"
      - "publish_youtube_shorts.py"
      - "src/youtube.py"
      - "src/youtube_shorts.py"
      - "assets/brand/**"

permissions:
  contents: write
  actions: write

concurrency:
  # All workflows that can push back to main share one queue. This avoids
  # simultaneous bot pushes racing and causing non-fast-forward failures.
  group: worth-buying-repo-writes
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test publishing and Shorts safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_article_images.py tests/test_youtube_shorts.py tests/test_site_pages.py tests/test_publishing_seo.py tests/test_retailer_measurement.py tests/test_publish_reconciliation.py tests/test_affiliate_tracking.py tests/test_social_promotion.py

      - name: Ensure FFmpeg is available for YouTube Shorts
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Generate AI article hero images
        env:
          PYTHONPATH: .
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python generate_ai_visuals.py --market uk

      - name: Save AI article hero images
        run: |
          mkdir -p assets/ai/uk
          git add assets/ai/uk
          if git diff --cached --quiet -- assets/ai/uk; then
            echo "No UK AI hero image changes to commit."
          else
            git config user.name "worth-buying-uk-bot"
            git config user.email "worth-buying-uk-bot@users.noreply.github.com"
            git commit -m "Add UK AI article hero images"
            git pull --rebase origin main
            git push
          fi

      - name: Verify required UK hero images
        env:
          PYTHONPATH: .
        run: python scripts/verify_article_images.py --market uk

      - name: Generate Pinterest images
        env:
          PYTHONPATH: .
        run: python generate_pinterest_images.py

      - name: Save Pinterest images
        run: |
          git add assets/pinterest
          if git diff --cached --quiet -- assets/pinterest; then
            echo "No Pinterest image changes to commit."
          else
            git config user.name "worth-buying-uk-bot"
            git config user.email "worth-buying-uk-bot@users.noreply.github.com"
            git commit -m "Update Pinterest article images"
            git pull --rebase origin main
            git push
          fi

      - name: Generate UK X images
        env:
          PYTHONPATH: .
        run: python generate_x_images.py --market uk

      - name: Save UK X images
        run: |
          git add assets/x/uk
          if git diff --cached --quiet -- assets/x/uk; then
            echo "No UK X image changes to commit."
          else
            git config user.name "worth-buying-uk-bot"
            git config user.email "worth-buying-uk-bot@users.noreply.github.com"
            git commit -m "Update UK X article images"
            git pull --rebase origin main
            git push
          fi

      - name: Prepare observed price-history charts
        env:
          PYTHONPATH: .
        run: |
          python generate_price_charts.py --market uk
          git add assets/price-history/uk
          if ! git diff --cached --quiet; then
            git config user.name "worth-buying-price-charts-bot"
            git config user.email "worth-buying-price-charts-bot@users.noreply.github.com"
            git commit -m "Refresh UK observed price charts"
            git pull --rebase origin main
            git push
          fi

      - name: Verify UK Blogger OAuth and blog target
        id: blogger_preflight
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/test_blogger_live.py --market uk

      - name: Publish UK articles to Blogger
        if: steps.blogger_preflight.outcome == 'success'
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOGGER_UK_EMAIL_POST_ADDRESS: ${{ secrets.BLOGGER_UK_EMAIL_POST_ADDRESS }}
        run: python publish_articles.py
      - name: Refresh UK authority hub pages
        if: steps.blogger_preflight.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python publish_site_pages.py --market uk

      - name: Prepare UK manual publishing package when Blogger is restricted
        if: steps.blogger_preflight.outcome == 'failure'
        env:
          PYTHONPATH: .
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: MARKET=uk BLOGGER_EMAIL_DELIVERY_MODE=manual python publish_articles_email.py

      - name: Publish matching UK YouTube Shorts
        continue-on-error: true
        env:
          PYTHONPATH: .
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_UK_REFRESH_TOKEN: ${{ secrets.YOUTUBE_UK_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python publish_youtube_shorts.py --market uk --today-only

      - name: Generate Pinterest RSS feed
        env:
          PYTHONPATH: .
        run: python generate_pinterest_feed.py

      - name: Check UK article discovery and Search Console
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONPATH: .
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_WRITE_CLIENT_ID: ${{ secrets.GSC_WRITE_CLIENT_ID }}
          GSC_WRITE_CLIENT_SECRET: ${{ secrets.GSC_WRITE_CLIENT_SECRET }}
          GSC_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_WRITE_REFRESH_TOKEN }}
          GSC_UK_SITE_URL: ${{ secrets.GSC_UK_SITE_URL }}
        run: python post_publish_seo.py --market uk

      - name: Publish new articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying UK"
        run: python publish_x.py

      - name: Publish new articles directly to Bluesky
        env:
          PYTHONPATH: .
          BLUESKY_UK_HANDLE: ${{ secrets.BLUESKY_UK_HANDLE }}
          BLUESKY_UK_APP_PASSWORD: ${{ secrets.BLUESKY_UK_APP_PASSWORD }}
        run: python publish_bluesky.py

      - name: Save publication state and Pinterest feed
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/state"
          cp state/articles_published.json "$SNAPSHOT_DIR/state/articles_published.json" 2>/dev/null || true
          cp state/email_published.json "$SNAPSHOT_DIR/state/email_published.json" 2>/dev/null || true
          cp state/x_published.json "$SNAPSHOT_DIR/state/x_published.json" 2>/dev/null || true
          cp state/bluesky_published.json "$SNAPSHOT_DIR/state/bluesky_published.json" 2>/dev/null || true
          cp state/youtube_uk_published.json "$SNAPSHOT_DIR/state/youtube_uk_published.json" 2>/dev/null || true
          cp state/site_pages_uk.json "$SNAPSHOT_DIR/state/site_pages_uk.json" 2>/dev/null || true

          git config user.name "worth-buying-uk-bot"
          git config user.email "worth-buying-uk-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "UK state save attempt $attempt/3"

            git fetch origin main
            git reset --hard origin/main

            python merge_workflow_state.py \
              --snapshot-dir "$SNAPSHOT_DIR" \
              state/articles_published.json \
              state/email_published.json \
              state/x_published.json \
              state/bluesky_published.json \
              state/youtube_uk_published.json \
              state/site_pages_uk.json

            PYTHONPATH=. python generate_pinterest_feed.py

            git add state/articles_published.json state/email_published.json state/x_published.json state/bluesky_published.json state/youtube_uk_published.json state/site_pages_uk.json pinterest-feed.xml

            if git diff --cached --quiet; then
              echo "No publication state or Pinterest feed changes to commit."
              exit 0
            fi

            git commit -m "Update UK publication state and Pinterest feed"

            if git push origin HEAD:main; then
              echo "UK publication state saved successfully."
              exit 0
            fi

            echo "Main changed before UK push; safely merging state and retrying."
          done

          echo "Could not save UK publication state after 3 attempts."
          exit 1

      - name: Start USA publisher after daily UK run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_usa }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles-us.yml --ref main
