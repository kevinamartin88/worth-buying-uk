name: Refresh CFS selling prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cfs_prices.py'
      - 'refresh_cfs_prices.py'
      - '.github/workflows/refresh-cfs-prices.yml'
  schedule:
    - cron: '43 7 * * *'

permissions:
  contents: write

concurrency:
  group: worth-buying-rakuten-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test current-price selection and existing article repairs
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_rakuten.py tests/test_rakuten_articles.py tests/test_cfs_prices.py tests/test_refresh_wardrobes.py
      - name: Update existing CFS offers from current product-page prices
        env:
          PYTHONPATH: .
          RAKUTEN_UK_CLIENT_ID: ${{ secrets.RAKUTEN_UK_CLIENT_ID }}
          RAKUTEN_UK_CLIENT_SECRET: ${{ secrets.RAKUTEN_UK_CLIENT_SECRET }}
          RAKUTEN_UK_ACCOUNT_ID: ${{ secrets.RAKUTEN_UK_ACCOUNT_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python refresh_cfs_prices.py
      - name: Save corrected source prices
        run: |
          git add articles/approved-retailer-*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "worth-buying-rakuten-bot"
          git config user.email "worth-buying-rakuten-bot@users.noreply.github.com"
          git commit -m "Refresh CFS current selling prices"
          git pull --rebase origin main
          git push
