name: Prime Blogger recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "state/manual-prime-blogger-recovery.txt"

permissions:
  contents: write

concurrency:
  group: worth-buying-prime-blogger-recovery
  cancel-in-progress: false

jobs:
  publish-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Prime hero images
        continue-on-error: true
        env:
          PYTHONPATH: .
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python generate_ai_visuals.py --market uk
          python generate_ai_visuals.py --market us

      - name: Save Prime hero images
        shell: bash
        run: |
          set -euo pipefail
          git add assets/ai/uk assets/ai/us
          if git diff --cached --quiet; then
            echo "No Prime hero image changes to commit."
          else
            git config user.name "worth-buying-prime-recovery-bot"
            git config user.email "worth-buying-prime-recovery-bot@users.noreply.github.com"
            git commit -m "Add Prime recovery hero images"
            git pull --rebase origin main
            git push
          fi

      - name: Verify UK Blogger
        id: uk_preflight
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/test_blogger_live.py --market uk

      - name: Publish UK Prime articles
        if: steps.uk_preflight.outcome == 'success'
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOGGER_UK_EMAIL_POST_ADDRESS: ${{ secrets.BLOGGER_UK_EMAIL_POST_ADDRESS }}
        run: python publish_articles.py

      - name: Verify USA Blogger
        id: us_preflight
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_US_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID }}
          BLOGGER_US_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET }}
          BLOGGER_US_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN }}
          BLOGGER_US_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
        run: python scripts/test_blogger_live.py --market us

      - name: Publish USA Prime articles
        if: steps.us_preflight.outcome == 'success'
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOGGER_US_EMAIL_POST_ADDRESS: ${{ secrets.BLOGGER_US_EMAIL_POST_ADDRESS }}
        run: python publish_articles_us.py

      - name: Save Blogger publication state
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/state"
          cp state/articles_published.json "$SNAPSHOT_DIR/state/articles_published.json" 2>/dev/null || true
          cp state/articles_us_published.json "$SNAPSHOT_DIR/state/articles_us_published.json" 2>/dev/null || true

          git config user.name "worth-buying-prime-recovery-bot"
          git config user.email "worth-buying-prime-recovery-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python merge_workflow_state.py \
              --snapshot-dir "$SNAPSHOT_DIR" \
              state/articles_published.json \
              state/articles_us_published.json
            git add state/articles_published.json state/articles_us_published.json
            if git diff --cached --quiet; then
              echo "No Blogger state changes to commit."
              exit 0
            fi
            git commit -m "Save Prime Blogger recovery state"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
