name: Verify Search Console sitemap submission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Submit UK and USA sitemaps
        env:
          PYTHONPATH: .
          GSC_WRITE_CLIENT_ID: ${{ secrets.GSC_WRITE_CLIENT_ID }}
          GSC_WRITE_CLIENT_SECRET: ${{ secrets.GSC_WRITE_CLIENT_SECRET }}
          GSC_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_WRITE_REFRESH_TOKEN }}
          GSC_UK_SITE_URL: ${{ secrets.GSC_UK_SITE_URL }}
          GSC_US_SITE_URL: ${{ secrets.GSC_US_SITE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urljoin

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          from post_publish_seo import WRITE_SCOPE
          from src.search_console import TOKEN_URI, choose_site
          from src.site_config import get_site_url

          names = ("GSC_WRITE_CLIENT_ID", "GSC_WRITE_CLIENT_SECRET", "GSC_WRITE_REFRESH_TOKEN")
          missing = [name for name in names if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GSC_WRITE_REFRESH_TOKEN"],
              token_uri=TOKEN_URI,
              client_id=os.environ["GSC_WRITE_CLIENT_ID"],
              client_secret=os.environ["GSC_WRITE_CLIENT_SECRET"],
              scopes=[WRITE_SCOPE],
          )
          service = build("searchconsole", "v1", credentials=credentials, cache_discovery=False)
          for market in ("uk", "us"):
              site = choose_site(service, market)
              if not site:
                  raise SystemExit(f"{market.upper()}: no accessible Search Console property")
              sitemap = urljoin(get_site_url(market), "sitemap.xml")
              service.sitemaps().submit(siteUrl=site, feedpath=sitemap).execute()
              print(f"{market.upper()}: submitted {sitemap} to {site}")
          PY

