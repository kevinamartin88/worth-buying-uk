name: Manual daily topic refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/manual-topic-refresh.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read requested market and topic
        id: request
        shell: bash
        run: |
          line="$(grep -v '^[[:space:]]*$' state/manual-topic-refresh.txt | tail -n 1)"
          market="$(printf '%s' "$line" | cut -d'|' -f2)"
          topic="$(printf '%s' "$line" | cut -d'|' -f3)"
          if [ "$market" != "uk" ] && [ "$market" != "us" ]; then
            echo "Invalid market in manual topic refresh: $market"
            exit 1
          fi
          if [ -z "$topic" ]; then
            echo "Missing topic in manual topic refresh."
            exit 1
          fi
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "topic=$topic" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test product variety and workflow safeguards
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_daily_retailer_prices.py
          tests/test_workflow_handoff.py

      - name: Refresh and safely save requested article
        id: save
        shell: bash
        env:
          PYTHONPATH: .
          EBAY_ENV: production
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
          MARKET: ${{ steps.request.outputs.market }}
          TOPIC: ${{ steps.request.outputs.topic }}
        run: |
          set -euo pipefail

          git config user.name "worth-buying-topic-refresh-bot"
          git config user.email "worth-buying-topic-refresh-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Topic refresh save attempt $attempt/3"

            # Always regenerate from the latest main. If another WorthBuying
            # workflow landed a commit while this job was waiting, the retry
            # starts clean instead of trying to rebase a dirty worktree.
            git fetch origin main
            git reset --hard origin/main

            python scripts/refresh_daily_topic.py               --market "$MARKET"               --topic "$TOPIC"

            # current_picks() records observed retailer prices while building
            # the article, so the price-history state is part of the same
            # atomic change and must never be left unstaged.
            git add articles articles-us state/daily_price_history.json

            if git diff --cached --quiet; then
              echo "No refreshed article or price-history changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh $MARKET $TOPIC guide"

            if git push origin HEAD:main; then
              echo "Refreshed article saved successfully."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main changed before the push; regenerating from latest main and retrying."
            sleep 2
          done

          echo "Could not save refreshed article after 3 clean retries."
          exit 1

      - name: Publish refreshed article
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET: ${{ steps.request.outputs.market }}
        shell: bash
        run: |
          if [ "$MARKET" = "uk" ]; then
            gh workflow run publish-articles.yml --ref main
          else
            gh workflow run publish-articles-us.yml --ref main
          fi
