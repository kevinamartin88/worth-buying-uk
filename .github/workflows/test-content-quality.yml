name: Test WorthBuying content quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/finish-worthbuying-improvements"
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "generate_price_charts.py"
      - "generate_daily_articles.py"
      - "generate_rakuten_articles.py"
      - "generate_supporting_articles.py"
      - "tests/test_supporting_articles.py"
      - "src/site_pages.py"
      - "tests/test_site_pages.py"
      - "generate_market_watch.py"
      - "generate_prime_big_deal_articles.py"
      - "tests/test_prime_big_deal_days.py"
      - "tests/test_market_watch.py"
      - "tests/test_daily_demand_gate.py"
      - "state/content-quality-test-trigger.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demand, authority and monetisation safeguards
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p test_cloud_editorial.py -v
          python cloud_editorial.py --preview
          python -m py_compile generate_daily_articles.py generate_prime_big_deal_articles.py
          python -m py_compile publish_articles.py publish_articles_us.py publish_x.py publish_x_us.py publish_bluesky.py publish_bluesky_us.py publish_youtube_shorts.py generate_pinterest_feed.py generate_pinterest_feed_us.py src/blogger.py src/social_promotion.py
          pytest -q tests/test_exposure_links.py tests/test_post_publish_seo.py tests/test_search_guides.py tests/test_owner_reviews.py tests/test_publishing_seo.py tests/test_publication_quality.py tests/test_retailer_measurement.py tests/test_publish_reconciliation.py tests/test_rakuten.py tests/test_product_image_quality.py tests/test_article_images.py tests/test_google_trends.py tests/test_google_shopping_trends.py tests/test_daily_demand_gate.py tests/test_supporting_articles.py tests/test_site_pages.py tests/test_market_watch.py tests/test_article_copy.py tests/test_ai_visuals.py tests/test_shopping_cache.py tests/test_price_tracking.py tests/test_price_charts.py tests/test_affiliate_tracking.py tests/test_workflow_handoff.py tests/test_daily_retailer_prices.py tests/test_blogger.py tests/test_ebay.py tests/test_ebay_deals.py tests/test_usa_conversion.py

      - name: Set up optional live publication probes on pull requests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Probe current UK and USA pages without writing or sending analytics
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_publication_quality_browser.py
          python verify_publication.py --market uk --recent 1 --read-only
          python verify_publication.py --market us --recent 1 --read-only
      - name: Save live publication probe reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: publication-quality-pr
          path: reports/publication-quality-*.json
          if-no-files-found: warn
          retention-days: 14
