name: Test WorthBuying content quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/finish-worthbuying-improvements"
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "generate_price_charts.py"
      - "generate_daily_articles.py"
      - "generate_rakuten_articles.py"
      - "generate_supporting_articles.py"
      - "tests/test_supporting_articles.py"
      - "src/site_pages.py"
      - "tests/test_site_pages.py"
      - "generate_market_watch.py"
      - "tests/test_market_watch.py"
      - "tests/test_daily_demand_gate.py"
      - "state/content-quality-test-trigger.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demand, authority and monetisation safeguards
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p test_cloud_editorial.py -v
          python cloud_editorial.py --preview
          python -m py_compile generate_daily_articles.py
          pytest -q tests/test_rakuten.py tests/test_product_image_quality.py tests/test_article_images.py tests/test_google_trends.py tests/test_google_shopping_trends.py tests/test_daily_demand_gate.py tests/test_supporting_articles.py tests/test_site_pages.py tests/test_market_watch.py tests/test_article_copy.py tests/test_shopping_cache.py tests/test_price_tracking.py tests/test_price_charts.py tests/test_affiliate_tracking.py tests/test_workflow_handoff.py tests/test_daily_retailer_prices.py tests/test_blogger.py tests/test_ebay.py tests/test_ebay_deals.py
