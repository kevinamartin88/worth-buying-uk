name: Test WorthBuying content quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_daily_articles.py"
      - "generate_supporting_articles.py"
      - "tests/test_supporting_articles.py"
      - "tests/test_daily_demand_gate.py"
      - "state/content-quality-test-trigger.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demand, authority and monetisation safeguards
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile generate_daily_articles.py
          pytest -q tests/test_google_trends.py tests/test_google_shopping_trends.py tests/test_daily_demand_gate.py tests/test_supporting_articles.py
