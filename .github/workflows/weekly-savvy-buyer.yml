name: Weekly Savvy Buyer authority article

on:
  workflow_dispatch:
  schedule:
    # One useful authority/support article each Monday. Daily commercial
    # buying guides continue every day; we deliberately avoid a second generic
    # Saturday article so crawl and internal-link equity stays product-focused.
    - cron: "30 7 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  queue: max
  cancel-in-progress: false

jobs:
  select-edition:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.edition.outputs.publish }}
      article_date: ${{ steps.edition.outputs.article_date }}
    steps:
      - name: Select the normal edition or the missed Saturday catch-up
        id: edition
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          today="$(date -u +%F)"
          article_date="$today"
          if [ "$EVENT_SCHEDULE" = "30 7 11 10 *" ]; then
            if [ "$today" != "2026-10-11" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            article_date="2026-10-10"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "article_date=$article_date" >> "$GITHUB_OUTPUT"

  create-savvy-buyer-articles:
    needs: select-edition
    if: needs.select-edition.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the twice-weekly article rotation
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_weekly_savvy_articles.py

      - name: Create one UK and one USA Savvy Buyer advice article
        env:
          ARTICLE_DATE: ${{ needs.select-edition.outputs.article_date }}
        run: python generate_weekly_savvy_articles.py --date "$ARTICLE_DATE"

      - name: Save the weekly articles
        id: save
        shell: bash
        run: |
          git add articles articles-us state/weekly_savvy_buyer.json
          if git diff --cached --quiet; then
            echo "No new weekly articles to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "worth-buying-savvy-buyer-bot"
          git config user.email "worth-buying-savvy-buyer-bot@users.noreply.github.com"
          git commit -m "Add UK and USA Savvy Buyer advice articles"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start UK and USA publishing workflows
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
