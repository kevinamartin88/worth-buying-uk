name: Reconcile manually published Blogger articles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: worth-buying-repo-writes
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect manually published UK articles
        env:
          PYTHONPATH: .
          MARKET: "uk"
          BLOGGER_EMAIL_DELIVERY_MODE: "manual"
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          READY_TO_PUBLISH_EMAIL: ${{ secrets.READY_TO_PUBLISH_EMAIL }}
        run: python publish_articles_email.py

      - name: Detect manually published USA articles
        env:
          PYTHONPATH: .
          MARKET: "us"
          BLOGGER_EMAIL_DELIVERY_MODE: "manual"
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          READY_TO_PUBLISH_EMAIL: ${{ secrets.READY_TO_PUBLISH_EMAIL }}
        run: python publish_articles_email.py

      - name: Ensure FFmpeg is available for YouTube Shorts
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Publish matching UK YouTube Shorts
        continue-on-error: true
        env:
          PYTHONPATH: .
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_UK_REFRESH_TOKEN: ${{ secrets.YOUTUBE_UK_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python publish_youtube_shorts.py --market uk

      - name: Publish matching USA YouTube Shorts
        continue-on-error: true
        env:
          PYTHONPATH: .
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_US_REFRESH_TOKEN: ${{ secrets.YOUTUBE_US_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python publish_youtube_shorts.py --market us

      - name: Refresh UK Pinterest feed
        env:
          PYTHONPATH: .
        run: python generate_pinterest_feed.py

      - name: Refresh USA Pinterest feed
        env:
          PYTHONPATH: .
        run: python generate_pinterest_feed_us.py

      - name: Check manually published article discovery
        continue-on-error: true
        env:
          PYTHONPATH: .
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_WRITE_CLIENT_ID: ${{ secrets.GSC_WRITE_CLIENT_ID }}
          GSC_WRITE_CLIENT_SECRET: ${{ secrets.GSC_WRITE_CLIENT_SECRET }}
          GSC_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_WRITE_REFRESH_TOKEN }}
          GSC_UK_SITE_URL: ${{ secrets.GSC_UK_SITE_URL }}
          GSC_US_SITE_URL: ${{ secrets.GSC_US_SITE_URL }}
        run: |
          python post_publish_seo.py --market uk
          python post_publish_seo.py --market us

      - name: Publish detected UK articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying UK"
        run: python publish_x.py

      - name: Publish detected USA articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying USA"
        run: python publish_x_us.py

      - name: Publish detected UK articles directly to Bluesky
        env:
          PYTHONPATH: .
          BLUESKY_UK_HANDLE: ${{ secrets.BLUESKY_UK_HANDLE }}
          BLUESKY_UK_APP_PASSWORD: ${{ secrets.BLUESKY_UK_APP_PASSWORD }}
        run: python publish_bluesky.py

      - name: Publish detected USA articles directly to Bluesky
        env:
          PYTHONPATH: .
          BLUESKY_US_HANDLE: ${{ secrets.BLUESKY_US_HANDLE }}
          BLUESKY_US_APP_PASSWORD: ${{ secrets.BLUESKY_US_APP_PASSWORD }}
        run: python publish_bluesky_us.py

      - name: Save reconciled publication state and feeds
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/state"
          cp state/articles_published.json "$SNAPSHOT_DIR/state/articles_published.json" 2>/dev/null || true
          cp state/articles_us_published.json "$SNAPSHOT_DIR/state/articles_us_published.json" 2>/dev/null || true
          cp state/email_published.json "$SNAPSHOT_DIR/state/email_published.json" 2>/dev/null || true
          cp state/x_published.json "$SNAPSHOT_DIR/state/x_published.json" 2>/dev/null || true
          cp state/x_us_published.json "$SNAPSHOT_DIR/state/x_us_published.json" 2>/dev/null || true
          cp state/bluesky_published.json "$SNAPSHOT_DIR/state/bluesky_published.json" 2>/dev/null || true
          cp state/bluesky_us_published.json "$SNAPSHOT_DIR/state/bluesky_us_published.json" 2>/dev/null || true
          cp state/youtube_uk_published.json "$SNAPSHOT_DIR/state/youtube_uk_published.json" 2>/dev/null || true
          cp state/youtube_us_published.json "$SNAPSHOT_DIR/state/youtube_us_published.json" 2>/dev/null || true

          git config user.name "worth-buying-reconcile-bot"
          git config user.email "worth-buying-reconcile-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "State save attempt $attempt/3"

            git fetch origin main
            git reset --hard origin/main

            python merge_workflow_state.py \
              --snapshot-dir "$SNAPSHOT_DIR" \
              state/articles_published.json \
              state/articles_us_published.json \
              state/email_published.json \
              state/x_published.json \
              state/x_us_published.json \
              state/bluesky_published.json \
              state/bluesky_us_published.json \
              state/youtube_uk_published.json \
              state/youtube_us_published.json

            PYTHONPATH=. python generate_pinterest_feed.py
            PYTHONPATH=. python generate_pinterest_feed_us.py

            git add \
              state/articles_published.json \
              state/articles_us_published.json \
              state/email_published.json \
              state/x_published.json \
              state/x_us_published.json \
              state/bluesky_published.json \
              state/bluesky_us_published.json \
              state/youtube_uk_published.json \
              state/youtube_us_published.json \
              pinterest-feed.xml \
              pinterest-feed-us.xml

            if git diff --cached --quiet; then
              echo "No reconciled publication changes to commit."
              exit 0
            fi

            git commit -m "Reconcile manually published Blogger articles"

            if git push origin HEAD:main; then
              echo "Reconciled publication state saved successfully."
              exit 0
            fi

            echo "Main changed before push; safely merging state and retrying."
          done

          echo "Could not save reconciled state after 3 attempts."
          exit 1
