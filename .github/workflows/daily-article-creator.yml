name: Daily UK and USA article creator

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC-only. These three triggers cover both GMT and BST;
    # the schedule gate below selects the two that correspond to 06:10 and
    # 07:10 Europe/London on the day of the run.
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
    - cron: "10 7 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  cancel-in-progress: false

jobs:
  uk-time-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}

    steps:
      - name: Select the UK primary or fallback window
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          uk_offset="$(TZ=Europe/London date +%z)"
          case "${EVENT_SCHEDULE}:${uk_offset}" in
            "10 5 * * *:+0100"|"10 6 * * *:+0000")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "slot=06:10 UK primary" >> "$GITHUB_OUTPUT"
              ;;
            "10 6 * * *:+0100"|"10 7 * * *:+0000")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "slot=07:10 UK fallback" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "slot=inactive DST coverage trigger" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "UK schedule selection: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

  create-daily-articles:
    needs: uk-time-gate
    if: needs.uk-time-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test search-demand selection safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_google_trends.py tests/test_google_shopping_trends.py tests/test_daily_demand_gate.py

      - name: Create one UK and one USA article
        env:
          PYTHONPATH: .
          EBAY_ENV: production
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: python generate_daily_articles.py

      - name: Save new daily articles
        id: save
        shell: bash
        run: |
          git add articles articles-us state/daily_article_generator.json
          if git diff --cached --quiet; then
            echo "No new daily articles to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "worth-buying-daily-bot"
          git config user.email "worth-buying-daily-bot@users.noreply.github.com"
          git commit -m "Add daily UK and USA buying guides"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start UK publishing workflow
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
