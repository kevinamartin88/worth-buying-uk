name: Daily UK and USA article creator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "state/manual-daily-kick.txt"
  schedule:
    # Start shortly after midnight and retry hourly through the early morning.
    # GitHub cron is UTC-only, so including 23:07 plus 00:07-06:07 gives us
    # a useful 00:07 UK attempt in BST and GMT. Later attempts are lightweight
    # because the state check exits as soon as today's UK/USA pair exists.
    # This gives GitHub several chances to recover from scheduler delays while
    # targeting completion well before 07:00 UK time.
    - cron: "7 23,0-6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  cancel-in-progress: false

jobs:
  uk-time-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}

    steps:
      - name: Select the UK primary or fallback window
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every scheduled trigger is a valid retry. The article-state check
          # below makes repeat attempts cheap once both daily guides exist.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "slot=$(TZ=Europe/London date '+%H:%M UK retry')" >> "$GITHUB_OUTPUT"
          echo "UK schedule selection: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

  create-daily-articles:
    needs: uk-time-gate
    if: needs.uk-time-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether today's UK and USA pair already exists
        id: daily
        shell: bash
        run: |
          today="$(TZ=Europe/London date +%F)"
          uk_date="$(jq -r '.uk.date // ""' state/daily_article_generator.json 2>/dev/null || true)"
          us_date="$(jq -r '.us.date // ""' state/daily_article_generator.json 2>/dev/null || true)"

          if [ "$uk_date" = "$today" ] && [ "$us_date" = "$today" ]; then
            echo "Today's UK and USA articles already exist; keeping this retry lightweight."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "At least one market still needs today's article."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.daily.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.daily.outputs.needed == 'true'
        run: pip install -r requirements.txt

      - name: Test search-demand selection safeguards
        if: steps.daily.outputs.needed == 'true'
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_google_trends.py tests/test_google_shopping_trends.py tests/test_daily_demand_gate.py

      - name: Create one UK and one USA article
        if: steps.daily.outputs.needed == 'true'
        env:
          PYTHONPATH: .
          EBAY_ENV: production
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: python generate_daily_articles.py

      - name: Save new daily articles
        id: save
        shell: bash
        run: |
          if [ "${{ steps.daily.outputs.needed }}" != "true" ]; then
            echo "No generation work needed in this retry."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add articles articles-us state/daily_article_generator.json state/daily_price_history.json state/google_shopping_cache.json
          if git diff --cached --quiet; then
            echo "No new daily articles to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "worth-buying-daily-bot"
          git config user.email "worth-buying-daily-bot@users.noreply.github.com"
          git commit -m "Create or refresh daily UK and USA buying guides"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start UK publishing workflow
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
