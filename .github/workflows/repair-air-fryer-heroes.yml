name: Repair UK and USA air-fryer images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repair_air_fryer_heroes.py'
      - '.github/workflows/repair-air-fryer-heroes.yml'
      - 'assets/ai/uk/best-large-capacity-air-fryers-worth-buying-uk.jpg'
      - 'assets/ai/us/best-large-capacity-air-fryers-worth-buying-us.jpg'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: uk
            client_id: BLOGGER_CLIENT_ID
            client_secret: BLOGGER_CLIENT_SECRET
            refresh_token: BLOGGER_REFRESH_TOKEN
            blog_id: BLOGGER_BLOG_ID
          - market: us
            client_id: BLOGGER_US_CLIENT_ID
            client_secret: BLOGGER_US_CLIENT_SECRET
            refresh_token: BLOGGER_US_REFRESH_TOKEN
            blog_id: BLOGGER_US_BLOG_ID
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test reviewed photo and image replacement safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_curated_visuals.py tests/test_article_images.py tests/test_ai_visuals.py
      - name: Replace and verify the existing article image
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets[matrix.client_id] }}
          BLOGGER_CLIENT_SECRET: ${{ secrets[matrix.client_secret] }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets[matrix.refresh_token] }}
          BLOGGER_BLOG_ID: ${{ secrets[matrix.blog_id] }}
          MARKET: ${{ matrix.market }}
        run: python repair_air_fryer_heroes.py --market "$MARKET"
