name: Monthly WorthBuying Market Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  queue: max
  cancel-in-progress: false

jobs:
  market-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test original-data report
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile generate_market_watch.py
          pytest -q tests/test_market_watch.py

      - name: Prepare original price charts
        env:
          PYTHONPATH: .
        run: |
          python generate_price_charts.py --market uk
          python generate_price_charts.py --market us

      - name: Generate monthly original-data article
        env:
          PYTHONPATH: .
        run: python generate_market_watch.py

      - name: Save market-watch articles
        shell: bash
        run: |
          git add articles articles-us state/monthly_market_watch.json assets/price-history
          if git diff --cached --quiet; then
            echo "Not enough original price-history data yet; no market-watch article created."
            exit 0
          fi
          git config user.name "worth-buying-market-watch-bot"
          git config user.email "worth-buying-market-watch-bot@users.noreply.github.com"
          git commit -m "Add monthly WorthBuying Market Watch"
          git pull --rebase origin main
          git push

      - name: Publish generated UK and USA articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
