name: Cloud bespoke guides and traffic improvement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [state/manual-cloud-editorial-kick.txt]
  schedule:
    # Two UTC opportunities accommodate BST/GMT and scheduler delays.
    # The program gates by London local time and records each completed slot.
    - cron: "13 9,10 * * 3"
    - cron: "23 10,11 * * 2,4"

permissions:
  contents: write
  actions: write

concurrency:
  group: worth-buying-repo-writes
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test cloud scheduling and publishing safeguards
        run: python -m unittest discover -s tests -p test_cloud_editorial.py -v
      - name: Configure repository identity
        run: |
          git config user.name "worth-buying-cloud-editorial-bot"
          git config user.email "worth-buying-cloud-editorial-bot@users.noreply.github.com"
      - name: Generate guides and run the bounded growth experiment
        env:
          PYTHONPATH: .
          EBAY_ENV: production
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_UK_SITE_URL: ${{ secrets.GSC_UK_SITE_URL }}
          GSC_US_SITE_URL: ${{ secrets.GSC_US_SITE_URL }}
        run: python cloud_editorial.py
      - name: Save articles, photos and execution records
        if: always()
        id: save
        shell: bash
        run: |
          set -euo pipefail
          for path in articles articles-us assets/ai drafts-bespoke state/cloud_editorial.json state/cloud_editorial_report.json state/daily_price_history.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet -- articles articles-us assets/ai; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Record cloud bespoke guides and measured promotion work"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Hand verified source changes to the UK and USA publishers
        if: success() && steps.save.outputs.publish_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-articles.yml --ref main -f chain_usa=true
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-editorial-report
          path: |
            state/cloud_editorial_report.json
            drafts-bespoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Surface blocked editorial work for GitHub failure notifications
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("state/cloud_editorial.json").read_text())
          blocked = {m: r.get("error") for m, r in state.get("weekly", {}).items() if r.get("status") == "blocked"}
          if blocked:
              raise SystemExit("Bespoke research blocked; draft and report saved: " + json.dumps(blocked))
          PY
