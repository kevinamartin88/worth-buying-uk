name: One-time carpet cleaner repair 2026-10-18
# retailer-rule-refresh-v1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-variety-pair-2026-10-17.yml"

permissions:
  contents: write

concurrency:
  group: worth-buying-carpet-cleaner-repair
  queue: max
  cancel-in-progress: false

jobs:
  create-variety-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate UK carpet-cleaner guide with machine-only matching
        env:
          PYTHONPATH: .
          EBAY_ENV: production
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: |
          python scripts/refresh_daily_topic.py --market uk --topic carpet-cleaners

      - name: Commit the regenerated UK carpet-cleaner guide
        run: |
          git restore state/daily_price_history.json 2>/dev/null || true
          git add articles/best-carpet-cleaners-worth-buying-uk.json
          if git diff --cached --quiet; then
            echo "No article changes were generated."
            exit 0
          fi
          git config user.name "worth-buying-variety-bot"
          git config user.email "worth-buying-variety-bot@users.noreply.github.com"
          git commit -m "Repair UK carpet-cleaner guide"
          git pull --rebase origin main
          git push
