name: Verify YouTube production access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify UK and USA channel access (no upload)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_UK_REFRESH_TOKEN: ${{ secrets.YOUTUBE_UK_REFRESH_TOKEN }}
          YOUTUBE_US_REFRESH_TOKEN: ${{ secrets.YOUTUBE_US_REFRESH_TOKEN }}
        run: |
          python scripts/test_youtube_live.py --market uk
          python scripts/test_youtube_live.py --market us
