name: Repair UK wardrobe offers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'refresh_wardrobe_roundup.py'
      - '.github/workflows/repair-wardrobe-roundup.yml'

permissions:
  contents: write

concurrency:
  group: worth-buying-rakuten-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test wardrobe selection and publication safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_rakuten.py tests/test_rakuten_articles.py tests/test_refresh_wardrobes.py
      - name: Replace accessory offers on the existing UK post
        env:
          PYTHONPATH: .
          RAKUTEN_UK_CLIENT_ID: ${{ secrets.RAKUTEN_UK_CLIENT_ID }}
          RAKUTEN_UK_CLIENT_SECRET: ${{ secrets.RAKUTEN_UK_CLIENT_SECRET }}
          RAKUTEN_UK_ACCOUNT_ID: ${{ secrets.RAKUTEN_UK_ACCOUNT_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python refresh_wardrobe_roundup.py
      - name: Save the corrected source article
        run: |
          git add articles/approved-retailer-wardrobes-uk-2026-10-05.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "worth-buying-rakuten-bot"
          git config user.email "worth-buying-rakuten-bot@users.noreply.github.com"
          git commit -m "Replace wardrobe accessories with complete UK wardrobes"
          git pull --rebase origin main
          git push
