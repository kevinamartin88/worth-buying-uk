name: Publish USA Blogger articles

# Temporary Mail2Blogger fallback while the Blogger API appeal is unresolved.
# New USA article files automatically publish by email, then continue to X/Pinterest.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "articles-us/**"
      - "publish_articles_email.py"
      - "publish_x_us.py"
      - "generate_pinterest_images_us.py"
      - "generate_pinterest_feed_us.py"
      - "generate_x_images.py"
      - "requirements.txt"
      - "src/buffer.py"

permissions:
  contents: write

concurrency:
  # All workflows that can push back to main share one queue. This avoids
  # simultaneous bot pushes racing and causing non-fast-forward failures.
  group: worth-buying-repo-writes
  cancel-in-progress: false

jobs:
  publish-us:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate USA AI article hero images
        env:
          PYTHONPATH: .
        run: python generate_ai_visuals.py --market us

      - name: Save USA AI article hero images
        run: |
          git add assets/ai/us
          if git diff --cached --quiet -- assets/ai/us; then
            echo "No USA AI hero image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Add USA AI article hero images"
            git pull --rebase origin main
            git push
          fi

      - name: Generate USA Pinterest images
        env:
          PYTHONPATH: .
        run: python generate_pinterest_images_us.py

      - name: Save USA Pinterest images
        run: |
          git add assets/pinterest/us
          if git diff --cached --quiet -- assets/pinterest/us; then
            echo "No USA Pinterest image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Update USA Pinterest article images"
            git pull --rebase origin main
            git push
          fi

      - name: Generate USA X images
        env:
          PYTHONPATH: .
        run: python generate_x_images.py --market us

      - name: Save USA X images
        run: |
          git add assets/x/us
          if git diff --cached --quiet -- assets/x/us; then
            echo "No USA X image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Update USA X article images"
            git pull --rebase origin main
            git push
          fi

      - name: Publish USA Blogger articles by email
        env:
          PYTHONPATH: .
          MARKET: "us"
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOGGER_US_EMAIL_POST_ADDRESS: ${{ secrets.BLOGGER_US_EMAIL_POST_ADDRESS }}
        run: python publish_articles_email.py

      - name: Generate USA Pinterest RSS feed
        env:
          PYTHONPATH: .
        run: python generate_pinterest_feed_us.py

      - name: Publish new USA articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying USA"
        run: python publish_x_us.py

      - name: Save USA article, X and Pinterest publication state
        run: |
          git config user.name "worth-buying-usa-bot"
          git config user.email "worth-buying-usa-bot@users.noreply.github.com"
          git add state/articles_us_published.json state/email_published.json state/x_us_published.json pinterest-feed-us.xml
          if git diff --cached --quiet; then
            echo "No USA publication state or Pinterest feed changes to commit."
            exit 0
          fi
          git commit -m "Update USA email publication state and Pinterest feed"
          git pull --rebase origin main
          git push
