name: Publish USA Blogger articles

# Publishes new and changed USA article files directly through the verified Blogger API.
# Posts are staged as drafts before going live, then feed X, Bluesky and Pinterest.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "articles-us/**"
      - "publish_articles_us.py"
      - "publish_site_pages.py"
      - "src/site_pages.py"
      - "src/article_copy.py"
      - "src/price_charts.py"
      - "generate_price_charts.py"
      - "src/blogger.py"
      - "generate_ai_visuals.py"
      - "src/ai_visuals.py"
      - "src/article_images.py"
      - "scripts/verify_article_images.py"
      - "publish_x_us.py"
      - "publish_bluesky_us.py"
      - "generate_pinterest_images_us.py"
      - "generate_pinterest_feed_us.py"
      - "generate_x_images.py"
      - "requirements.txt"
      - "src/buffer.py"
      - "src/bluesky.py"
      - "publish_youtube_shorts.py"
      - "src/youtube.py"
      - "src/youtube_shorts.py"
      - "assets/brand/**"

permissions:
  contents: write

concurrency:
  # All workflows that can push back to main share one queue. This avoids
  # simultaneous bot pushes racing and causing non-fast-forward failures.
  group: worth-buying-repo-writes
  cancel-in-progress: false

jobs:
  publish-us:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test publishing and Shorts safeguards
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_article_images.py tests/test_youtube_shorts.py tests/test_site_pages.py tests/test_affiliate_tracking.py

      - name: Ensure FFmpeg is available for YouTube Shorts
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Generate USA AI article hero images
        env:
          PYTHONPATH: .
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python generate_ai_visuals.py --market us

      - name: Save USA AI article hero images
        run: |
          mkdir -p assets/ai/us
          git add assets/ai/us
          if git diff --cached --quiet -- assets/ai/us; then
            echo "No USA AI hero image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Add USA AI article hero images"
            git pull --rebase origin main
            git push
          fi

      - name: Verify required USA hero images
        env:
          PYTHONPATH: .
        run: python scripts/verify_article_images.py --market us

      - name: Generate USA Pinterest images
        env:
          PYTHONPATH: .
        run: python generate_pinterest_images_us.py

      - name: Save USA Pinterest images
        run: |
          git add assets/pinterest/us
          if git diff --cached --quiet -- assets/pinterest/us; then
            echo "No USA Pinterest image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Update USA Pinterest article images"
            git pull --rebase origin main
            git push
          fi

      - name: Generate USA X images
        env:
          PYTHONPATH: .
        run: python generate_x_images.py --market us

      - name: Save USA X images
        run: |
          git add assets/x/us
          if git diff --cached --quiet -- assets/x/us; then
            echo "No USA X image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Update USA X article images"
            git pull --rebase origin main
            git push
          fi

      - name: Prepare observed price-history charts
        env:
          PYTHONPATH: .
        run: |
          python generate_price_charts.py --market us
          git add assets/price-history/us
          if ! git diff --cached --quiet; then
            git config user.name "worth-buying-price-charts-bot"
            git config user.email "worth-buying-price-charts-bot@users.noreply.github.com"
            git commit -m "Refresh USA observed price charts"
            git pull --rebase origin main
            git push
          fi

      - name: Verify USA Blogger OAuth and blog target
        id: blogger_preflight
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_US_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID }}
          BLOGGER_US_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET }}
          BLOGGER_US_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN }}
          BLOGGER_US_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
        run: python scripts/test_blogger_live.py --market us

      - name: Publish USA articles to Blogger
        if: steps.blogger_preflight.outcome == 'success'
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOGGER_US_EMAIL_POST_ADDRESS: ${{ secrets.BLOGGER_US_EMAIL_POST_ADDRESS }}
        run: python publish_articles_us.py
      - name: Refresh USA authority hub pages
        if: steps.blogger_preflight.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
        run: python publish_site_pages.py --market us

      - name: Prepare USA manual publishing package when Blogger is restricted
        if: steps.blogger_preflight.outcome == 'failure'
        env:
          PYTHONPATH: .
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: MARKET=us BLOGGER_EMAIL_DELIVERY_MODE=manual python publish_articles_email.py

      - name: Publish matching USA YouTube Shorts
        continue-on-error: true
        env:
          PYTHONPATH: .
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_US_REFRESH_TOKEN: ${{ secrets.YOUTUBE_US_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python publish_youtube_shorts.py --market us

      - name: Generate USA Pinterest RSS feed
        env:
          PYTHONPATH: .
        run: python generate_pinterest_feed_us.py

      - name: Check USA article discovery and Search Console
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONPATH: .
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_WRITE_CLIENT_ID: ${{ secrets.GSC_WRITE_CLIENT_ID }}
          GSC_WRITE_CLIENT_SECRET: ${{ secrets.GSC_WRITE_CLIENT_SECRET }}
          GSC_WRITE_REFRESH_TOKEN: ${{ secrets.GSC_WRITE_REFRESH_TOKEN }}
          GSC_US_SITE_URL: ${{ secrets.GSC_US_SITE_URL }}
        run: python post_publish_seo.py --market us

      - name: Publish new USA articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying USA"
        run: python publish_x_us.py

      - name: Publish new USA articles directly to Bluesky
        env:
          PYTHONPATH: .
          BLUESKY_US_HANDLE: ${{ secrets.BLUESKY_US_HANDLE }}
          BLUESKY_US_APP_PASSWORD: ${{ secrets.BLUESKY_US_APP_PASSWORD }}
        run: python publish_bluesky_us.py

      - name: Save USA article, X, Bluesky and Pinterest publication state
        shell: bash
        run: |
          set -euo pipefail

          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/state"
          cp state/articles_us_published.json "$SNAPSHOT_DIR/state/articles_us_published.json" 2>/dev/null || true
          cp state/email_published.json "$SNAPSHOT_DIR/state/email_published.json" 2>/dev/null || true
          cp state/x_us_published.json "$SNAPSHOT_DIR/state/x_us_published.json" 2>/dev/null || true
          cp state/bluesky_us_published.json "$SNAPSHOT_DIR/state/bluesky_us_published.json" 2>/dev/null || true
          cp state/youtube_us_published.json "$SNAPSHOT_DIR/state/youtube_us_published.json" 2>/dev/null || true
          cp state/site_pages_us.json "$SNAPSHOT_DIR/state/site_pages_us.json" 2>/dev/null || true

          git config user.name "worth-buying-usa-bot"
          git config user.email "worth-buying-usa-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "USA state save attempt $attempt/3"

            git fetch origin main
            git reset --hard origin/main

            python merge_workflow_state.py \
              --snapshot-dir "$SNAPSHOT_DIR" \
              state/articles_us_published.json \
              state/email_published.json \
              state/x_us_published.json \
              state/bluesky_us_published.json \
              state/youtube_us_published.json \
              state/site_pages_us.json

            PYTHONPATH=. python generate_pinterest_feed_us.py

            git add state/articles_us_published.json state/email_published.json state/x_us_published.json state/bluesky_us_published.json state/youtube_us_published.json state/site_pages_us.json pinterest-feed-us.xml

            if git diff --cached --quiet; then
              echo "No USA publication state or Pinterest feed changes to commit."
              exit 0
            fi

            git commit -m "Update USA publication state and Pinterest feed"

            if git push origin HEAD:main; then
              echo "USA publication state saved successfully."
              exit 0
            fi

            echo "Main changed before USA push; safely merging state and retrying."
          done

          echo "Could not save USA publication state after 3 attempts."
          exit 1
