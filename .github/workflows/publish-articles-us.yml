name: Publish USA Blogger articles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "articles-us/**"
      - "publish_articles_us.py"
      - "publish_x_us.py"
      - "generate_x_images.py"
      - "requirements.txt"
      - "src/blogger.py"
      - "src/buffer.py"
      - ".github/workflows/publish-articles-us.yml"

permissions:
  contents: write

concurrency:
  group: blogger-article-publisher-us
  cancel-in-progress: false

jobs:
  publish-us:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate USA X images
        env:
          PYTHONPATH: .
        run: python generate_x_images.py --market us

      - name: Save USA X images
        run: |
          git add assets/x/us
          if git diff --cached --quiet -- assets/x/us; then
            echo "No USA X image changes to commit."
          else
            git config user.name "worth-buying-usa-bot"
            git config user.email "worth-buying-usa-bot@users.noreply.github.com"
            git commit -m "Update USA X article images"
            git pull --rebase origin main
            git push
          fi

      - name: Publish USA Blogger articles
        env:
          PYTHONPATH: .
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_US_CLIENT_ID || secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_US_CLIENT_SECRET || secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_US_REFRESH_TOKEN || secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_US_BLOG_ID }}
          EPN_US_CAMPAIGN_ID: ${{ secrets.EPN_US_CAMPAIGN_ID }}
        run: python publish_articles_us.py

      - name: Publish new USA articles to X through Buffer
        env:
          PYTHONPATH: .
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: "Worth Buying USA"
        run: python publish_x_us.py

      - name: Save USA article and X publication state
        run: |
          git config user.name "worth-buying-usa-bot"
          git config user.email "worth-buying-usa-bot@users.noreply.github.com"
          git add state/articles_us_published.json state/x_us_published.json
          if git diff --cached --quiet; then
            echo "No USA publication state changes to commit."
            exit 0
          fi
          git commit -m "Update USA article and X publication state"
          git pull --rebase origin main
          git push
