name: Diagnose WorthBuying domain routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-domain-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Public DNS and redirect tests
        shell: bash
        run: |
          set -u
          for domain in worthbuyinguk.co.uk worthbuyingusa.com; do
            echo
            echo "############################"
            echo "DOMAIN: $domain"
            echo "############################"

            for host in "$domain" "www.$domain"; do
              echo "===== DNS: $host ====="
              getent ahosts "$host" || true
            done

            for url in               "http://$domain/"               "https://$domain/"               "http://www.$domain/"               "https://www.$domain/"               "https://www.$domain/sitemap.xml"; do
              echo
              echo "===== HEAD: $url ====="
              curl -sS -I --connect-timeout 10 --max-time 20                 -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"                 "$url" || true
            done

            echo
            echo "===== FOLLOW REDIRECTS: apex HTTPS ($domain) ====="
            curl -sS -I -L --max-redirs 10 --connect-timeout 10 --max-time 30               -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"               "https://$domain/" || true
          done

          echo
          echo "===== BLOGSPOT BACKENDS ====="
          for url in "https://worthbuyinguk.blogspot.com/" "https://worthbuyingusa.blogspot.com/"; do
            echo
            echo "===== HEAD: $url ====="
            curl -sS -I --connect-timeout 10 --max-time 20               -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"               "$url" || true
          done

      - name: Inspect Cloudflare zone configuration
        shell: bash
        run: |
          set -u
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available to this workflow."
            exit 0
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          for domain in worthbuyinguk.co.uk worthbuyingusa.com; do
            echo
            echo "############################"
            echo "CLOUDFLARE ZONE: $domain"
            echo "############################"

            zone_json="$(curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$domain")"
            echo "===== ZONE LOOKUP ====="
            echo "$zone_json" | jq '{success,errors,result:[.result[]? | {id,name,status,type}]}'
            zone_id="$(echo "$zone_json" | jq -r '.result[0].id // empty')"
            if [ -z "$zone_id" ]; then
              echo "No accessible Cloudflare zone found with this token."
              continue
            fi

            echo "===== DNS RECORDS ====="
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100"               | jq '{success,errors,result:[.result[]? | {id,type,name,content,proxied,ttl}]}'

            echo "===== ZONE RULESETS ====="
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets"               | jq '{success,errors,result:[.result[]? | {id,name,kind,phase}]}'

            echo "===== PAGE RULES ====="
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/pagerules?status=active&per_page=100"               | jq '{success,errors,result:[.result[]? | {id,status,targets,actions,priority}]}'

            echo "===== ALWAYS USE HTTPS ====="
            curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/always_use_https"               | jq '{success,errors,result:{id:.result.id,value:.result.value,modified_on:.result.modified_on}}'
          done
